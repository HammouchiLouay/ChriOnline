# Optional packaged defaults. You do NOT need to edit this file for mail to work.
#
# Configure mail in one of these ways (no access to this repo / src required):
#  1) Environment variables on the machine that runs ServerMain (best for Docker / cloud):
#       CHRIONLINE_RESEND_API_KEY=re_xxxx   OR   CHRIONLINE_SMTP_HOST, CHRIONLINE_SMTP_USER, ...
#  2) User config file (any PC that hosts the server):
#       Windows: %USERPROFILE%\.chrionline\email-config.properties
#       Linux/macOS: ~/.chrionline/email-config.properties
#
# Verification codes are sent TO each user's registered e-mail. Sending uses ONE app-wide credential
# (Resend API key or SMTP), never the shopper's personal mailbox password.

# Resend (HTTPS, one API key — see https://resend.com )
resend.api.key=

# SMTP (e.g. Gmail app password) — leave host empty if using Resend only
mail.smtp.host=
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true
mail.smtp.ssl.trust=smtp.gmail.com
mail.smtp.ssl.checkserveridentity=true
mail.smtp.user=
mail.smtp.password=
mail.from=
