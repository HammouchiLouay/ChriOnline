# TLS/SSL transport configuration for the ChriOnline socket protocol.
# Optional per-user overlay:
#   ~/.chrionline/ssl-config.properties
# (Windows: %USERPROFILE%\.chrionline\ssl-config.properties)
#
# You can also set environment variables (recommended for passwords):
#   CHRIONLINE_SERVER_SSL_ENABLED=true
#   CHRIONLINE_SERVER_SSL_KEYSTORE_PATH=...
#   CHRIONLINE_SERVER_SSL_KEYSTORE_PASSWORD=...
#   CHRIONLINE_CLIENT_SSL_ENABLED=true
#   CHRIONLINE_CLIENT_SSL_TRUSTSTORE_PATH=...
#   CHRIONLINE_CLIENT_SSL_TRUSTSTORE_PASSWORD=...
#
# By default TLS is off (plain TCP). Enable on server and client together.
server.ssl.enabled=false
server.ssl.protocol=TLS
server.ssl.key-store.type=PKCS12
# server.ssl.key-store.path=C:/path/to/server-keystore.p12
# server.ssl.key-store.password=changeit
# Optional: if the key entry has a different password; default = store password
# server.ssl.key.password=changeit
# Optional: informational alias used when creating the keystore with keytool
# server.ssl.key-alias=chrionline

client.ssl.enabled=false
client.ssl.protocol=TLS
client.ssl.trust-store.type=PKCS12
# client.ssl.trust-store.path=C:/path/to/truststore.p12
# client.ssl.trust-store.password=changeit

# -----------------------------------------------------------------------------
# Mini-Projet 2 — protocole applicatif RSA (échange de clé AES) + AES-GCM sur les lignes socket.
# RSA/AES is mandatory. It is no longer controlled by a client checkbox or enabled/required flags.
#
# Le serveur utilise une paire RSA dans un PKCS12 (keytool). Si les propriétés session.* sont vides,
# le serveur retombe sur server.ssl.key-store.* (même fichier que TLS, si RSA), puis sur une paire éphémère.
# -----------------------------------------------------------------------------
server.crypto.session.rsa.keystore.path=
server.crypto.session.rsa.keystore.password=
server.crypto.session.rsa.key.alias=chrionline-session

# Stockage chiffré (AES-GCM) pour les templates sensibles en base — clé dérivée serveur (32 octets en Base64).
storage.crypto.enabled=false
# storage.crypto.aes.key.base64=<Base64 de 32 octets>

