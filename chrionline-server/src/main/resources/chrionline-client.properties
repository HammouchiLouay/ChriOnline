# Client → socket server (not MySQL). Optional per-user overlay: ~/.chrionline/chrionline-client.properties
# (Windows: %USERPROFILE%\.chrionline\...) — same keys; no project path required.
#
# Allow 127.0.0.1 / localhost when client and server run on the same PC (default true).
# Set false to force LAN-style addresses only (e.g. classroom demo).
client.allow.loopback=true
#
# Leave server.host empty for automatic discovery (multicast). Or set a fixed host.
# Environment overrides: CHRIONLINE_SERVER_HOST / CHRIONLINE_SERVER_PORT
#
# server.host=
server.port=6000
#
# Mini-Projet 2 : chiffrement applicatif RSA→AES obligatoire sur les messages socket.
# There is no client toggle anymore; every connection performs the secure handshake.
discovery.enabled=true
# Per attempt listen window (ms); several rounds with pause improve Wi‑Fi / multicast reliability
discovery.timeout.ms=3500
discovery.retry.rounds=5
discovery.retry.pause.ms=500

# TLS (socket transport). When enabled, the client will use a truststore to verify the server certificate.
# The truststore typically contains the server's certificate (self-signed) or your CA certificate.
client.ssl.enabled=false
# client.ssl.trust-store.path=C:/path/to/truststore.p12
# client.ssl.trust-store.password=changeit
# client.ssl.trust-store.type=PKCS12
